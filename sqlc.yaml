version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migration"
    queries: "db/query"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"          # use the pgx v5 driver, not database/sql
        emit_json_tags: true
        emit_interface: true            # generates a Querier interface -> mockable
        emit_empty_slices: true         # []T{} instead of nil for :many
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
