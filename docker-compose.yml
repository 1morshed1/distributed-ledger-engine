# Phase 1 local stack: Postgres (ledger) + Redis (cache / Asynq backend).
# Kafka, Spark, Airflow get added in later phases.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ledger
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (5432 used by another project)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ledger-redis
    ports:
      - "6380:6379"   # host 6380 -> container 6379 (6379 used by another project)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single-node Kafka in KRaft mode (no ZooKeeper). Dev only.
  kafka:
    image: apache/kafka:3.8.0
    container_name: ledger-kafka
    ports:
      - "9092:9092"   # external listener for host apps
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two data listeners: EXTERNAL for host apps (localhost:9092), INTERNAL for
      # other containers (kafka:9094). A single advertised addr can't serve both.
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single broker -> everything replication factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # NOTE: Spark is NOT containerized. The fraud detector runs as a local PySpark
  # job via spark-submit (see spark-fraud-detector/). It connects to Kafka on
  # localhost:9092 and Postgres on localhost:5433 from the host.

  # S3-compatible object store for reconciliation reports (Phase 4).
  # NOTE: MinIO would be the natural choice, but its Docker Hub images were
  # removed and this host's Docker can't auth to quay.io; LocalStack's image now
  # requires a Pro license and quits. adobe/s3mock is a license-free S3 mock on
  # Docker Hub. The DAG talks S3 via boto3 with a custom endpoint, so swapping to
  # real AWS S3 later is just an endpoint/cred change.
  s3mock:
    image: adobe/s3mock:latest
    container_name: ledger-s3mock
    environment:
      initialBuckets: ledger-reports
      # s3mock needs path-style access (handled in the boto3 client too).
    ports:
      - "9095:9090"   # S3 API (http); host 9095 to leave 9090 for the app's gRPC

  # Airflow metadata DB (separate from the ledger DB on purpose).
  airflow-postgres:
    image: postgres:16-alpine
    container_name: ledger-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflowpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.10.3
    container_name: ledger-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      _PIP_ADDITIONAL_REQUIREMENTS: "boto3 psycopg2-binary"
      # DAG runtime config (ledger DB + MinIO reachable by service name).
      LEDGER_DB_HOST: postgres
      LEDGER_DB_PORT: "5432"
      LEDGER_DB_NAME: ledger
      LEDGER_DB_USER: ledger
      LEDGER_DB_PASSWORD: secret
      S3_ENDPOINT: http://s3mock:9090
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_BUCKET: ledger-reports
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    entrypoint:
      - /bin/bash
      - -c
      - airflow db migrate && airflow users create --username admin --password admin --firstname a --lastname d --role Admin --email admin@example.com || true

  airflow-webserver:
    image: apache/airflow:2.10.3
    container_name: ledger-airflow-web
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    ports:
      - "8088:8080"   # airflow UI (8080 used by our Go API)
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.10.3
    container_name: ledger-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: scheduler
    restart: unless-stopped

  # ---- Observability stack (Phase 5) --------------------------------------
  # Jaeger: distributed tracing UI + OTLP collector. The Go API exports spans
  # to localhost:4318 (OTLP/HTTP).
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: ledger-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP
      - "4317:4317"     # OTLP gRPC

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ledger-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"     # UI (9090 used by s3mock)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so it can scrape the host-run API

  grafana:
    image: grafana/grafana:11.3.0
    container_name: ledger-grafana
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:3.2.1
    container_name: ledger-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.2.1
    container_name: ledger-promtail
    depends_on:
      - loki
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
  airflowpgdata:
  grafanadata:
  lokidata:
