# Phase 1 local stack: Postgres (ledger) + Redis (cache / Asynq backend).
# Kafka, Spark, Airflow get added in later phases.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ledger
    ports:
      - "5433:5432"   # host 5433 -> container 5432 (5432 used by another project)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ledger-redis
    ports:
      - "6380:6379"   # host 6380 -> container 6379 (6379 used by another project)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single-node Kafka in KRaft mode (no ZooKeeper). Dev only.
  kafka:
    image: apache/kafka:3.8.0
    container_name: ledger-kafka
    ports:
      - "9092:9092"   # external listener for host apps
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two data listeners: EXTERNAL for host apps (localhost:9092), INTERNAL for
      # other containers (kafka:9094). A single advertised addr can't serve both.
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single broker -> everything replication factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # NOTE: Spark is NOT containerized. The fraud detector runs as a local PySpark
  # job via spark-submit (see spark-fraud-detector/). It connects to Kafka on
  # localhost:9092 and Postgres on localhost:5433 from the host.

volumes:
  pgdata:
