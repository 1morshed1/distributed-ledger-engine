# Minimal, non-fussy linter set. Generated code (internal/db, internal/pb) is
# excluded since sqlc/protoc own it.
run:
  timeout: 5m

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gofmt

issues:
  exclude-dirs:
    - internal/pb
  exclude-rules:
    - path: internal/db/.*\.go
      text: "SA|errcheck"
