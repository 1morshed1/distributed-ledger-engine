# Secrets. In real clusters these come from AWS Secrets Manager via the External
# Secrets Operator (see plan) — NEVER committed. This file uses stringData with
# dev values purely so `kubectl apply -k` works out of the box on a local kind
# cluster. Rotate/replace for anything real.
apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
  namespace: ledger
type: Opaque
stringData:
  DB_SOURCE: "postgresql://ledger:secret@host.docker.internal:5433/ledger?sslmode=disable"
  TOKEN_SYMMETRIC_KEY: "12345678901234567890123456789012"
