# Horizontal Pod Autoscaler: scale ledger-api on CPU. Requires metrics-server
# in the cluster (`kubectl apply -f https://.../metrics-server`) and CPU requests
# set on the pods (they are, in deployment.yaml).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-api
  namespace: ledger
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledger-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # scale out above 70% CPU
